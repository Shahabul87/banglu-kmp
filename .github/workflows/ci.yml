# S128 (production audit): the repository previously had NO pull-request
# gate — only the desktop tag-packaging workflow. This runs every shipping
# surface's test wall on a CLEAN CLONE: the dictionary comes from the
# `dictionary` release asset (kept at DictionaryVersion.REQUIRED), the slim
# web dictionary is generated from it, and the JS parity walls FAIL (not
# skip) if the slim is missing (CI=true check inside the tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walls:
    name: Engine + Android + Desktop walls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Download compiled dictionary (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dictionary --pattern dictionary.sqlite --output dictionary.sqlite --repo "$GITHUB_REPOSITORY"
          ls -la dictionary.sqlite

      - name: Verify dictionary matches DictionaryVersion.REQUIRED
        run: |
          REQUIRED=$(grep -oP 'REQUIRED = "\K[^"]+' shared/src/commonMain/kotlin/com/banglu/engine/DictionaryVersion.kt)
          ACTUAL=$(sqlite3 dictionary.sqlite "SELECT value FROM metadata WHERE key='version';")
          echo "required=$REQUIRED actual=$ACTUAL"
          test "$REQUIRED" = "$ACTUAL" || { echo "::error::dictionary release asset is $ACTUAL but engine requires $REQUIRED — upload the current dictionary.sqlite to the 'dictionary' release"; exit 1; }

      - name: Stage dictionary for Android assets and desktop resources
        run: |
          cp dictionary.sqlite android-keyboard/src/main/assets/dictionary.sqlite
          mkdir -p desktop-app/resources/common
          cp dictionary.sqlite desktop-app/resources/common/dictionary.sqlite
          mkdir -p windows-ime/resources/common
          cp dictionary.sqlite windows-ime/resources/common/dictionary.sqlite

      - name: Generate slim web dictionary
        run: ./gradlew :dictionary-compiler:run --args="slim $PWD/dictionary.sqlite $PWD/shared/banglu-slim.json"

      - name: Privacy boundary + full test walls + lint
        env:
          BANGLU_SLIM_PATH: ${{ github.workspace }}/shared/banglu-slim.json
        run: |
          ./gradlew \
            :android-keyboard:verifyImePrivacyBoundary \
            :shared:jvmTest \
            :shared:testDebugUnitTest \
            :shared:jsNodeTest \
            :android-keyboard:lintRelease \
            :android-keyboard:testDebugUnitTest \
            :android-keyboard:testReleaseUnitTest \
            :desktop-app:test \
            :desktop-app:verifyPackagedDictionary \
            :windows-ime:test \
            :windows-ime:verifyHookIsolation \
            :windows-ime:verifyPackagedDictionary

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-keyboard/build/reports/lint-results-release.*
          if-no-files-found: ignore
