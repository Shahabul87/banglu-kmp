# বাংলু টাইপার (Windows IME) — jpackage MSI, built + released from a tag.
# Modeled on desktop-release.yml's shape (dictionary fetch → build → upload)
# plus ci.yml's dictionary-version preflight, but for one Windows-only
# module: MSI packaging cannot cross-compile, so this always runs on
# windows-latest. Trigger: push a tag like windows-v1.0.0.
name: windows-ime-release
on:
  workflow_dispatch:
    inputs:
      console:
        description: "Diagnostic build: console launcher that prints JVM startup errors"
        type: boolean
        default: false
  push:
    tags: ["windows-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Bump discipline, enforced before anything expensive runs. Windows
      # Installer compares ProductVersion (from `bangluTyperVersion`) and the
      # in-app updater compares the manifest version (from the tag): if those
      # two disagree, the MSI either looks like a downgrade to the installer or
      # is invisible to every already-installed copy. Both failures are silent
      # at build time and only show up on a user's machine, so they are caught
      # here instead — in five seconds rather than after a twenty-minute build.
      - name: Tag must match bangluTyperVersion
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        run: |
          set -euo pipefail
          BUILD_VERSION=$(grep -oE 'val bangluTyperVersion = "[0-9.]+"' windows-ime/build.gradle.kts | grep -oE '[0-9]+(\.[0-9]+)+')
          TAG_VERSION="${GITHUB_REF_NAME#windows-v}"
          echo "build.gradle.kts=$BUILD_VERSION tag=$TAG_VERSION"
          if [ "$BUILD_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match bangluTyperVersion=$BUILD_VERSION in windows-ime/build.gradle.kts — bump one of them"
            exit 1
          fi

      # windows-latest defaults new shell steps to PowerShell; every step
      # below uses POSIX syntax (heredocs, $(...), &&), so shell: bash is
      # explicit throughout (Git for Windows ships bash on this runner).
      - name: Fetch dictionary (release asset)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dictionary --pattern dictionary.sqlite --output dictionary.sqlite --repo "$GITHUB_REPOSITORY"
          ls -la dictionary.sqlite

      # Fails fast, before any Gradle work, with a clear message — the
      # ci.yml grep+sqlite3 pattern would also work but relies on the
      # sqlite3 CLI and grep -P, neither guaranteed on windows-latest;
      # Python (preinstalled on this runner image) does both portably.
      - name: Verify dictionary matches DictionaryVersion.REQUIRED
        shell: bash
        run: |
          cat > check_dict_version.py <<'PYEOF'
          import re, sqlite3, sys
          # encoding is explicit: Python on Windows defaults to the locale
          # codepage (cp1252), and this file's changelog comments are Bengali,
          # so a bare open() dies with UnicodeDecodeError on the runner.
          src = open("shared/src/commonMain/kotlin/com/banglu/engine/DictionaryVersion.kt", encoding="utf-8").read()
          required = re.search(r'REQUIRED\s*=\s*"([^"]+)"', src).group(1)
          conn = sqlite3.connect("dictionary.sqlite")
          actual = conn.execute("SELECT value FROM metadata WHERE key='version'").fetchone()[0]
          print(f"required={required} actual={actual}")
          if required != actual:
              print(f"::error::dictionary release asset is {actual} but engine requires {required} — upload the current dictionary.sqlite to the dictionary release")
              sys.exit(1)
          PYEOF
          python check_dict_version.py
          rm check_dict_version.py

      - name: Stage dictionary for windows-ime resources
        shell: bash
        run: |
          mkdir -p windows-ime/resources/common
          cp dictionary.sqlite windows-ime/resources/common/dictionary.sqlite

      - name: Test + build MSI
        shell: bash
        env:
          BANGLU_JDK: ${{ env.JAVA_HOME }}
        run: ./gradlew :windows-ime:test :windows-ime:packageMsi --no-daemon -PbangluConsole=${{ inputs.console || false }}

      - uses: actions/upload-artifact@v4
        with:
          name: banglu-typer-windows-msi
          path: windows-ime/build/compose/binaries/main/msi/*.msi

      # The in-app updater's whole input, generated from the MSI that was just
      # built so the two can never describe different files. Computed here
      # rather than written by hand for exactly that reason: a hand-maintained
      # checksum is a checksum that eventually does not match, and a mismatch
      # aborts the user's update.
      - name: Generate windows-update.json
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MSI=$(ls windows-ime/build/compose/binaries/main/msi/*.msi)
          VERSION="${TAG#windows-v}"
          # sha256sum ships with Git for Windows' bash on this runner and
          # streams the file rather than reading ~150MB into memory.
          SHA=$(sha256sum "$MSI" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$MSI")"
          # Python builds the JSON so the Bengali notes line is escaped by a
          # real JSON encoder — a quote or a backslash in that file must not be
          # able to produce a manifest the app then refuses to parse.
          cat > gen_manifest.py <<'PYEOF'
          import json, os, sys
          version, url, sha, notes_file = sys.argv[1:5]
          notes = ""
          if os.path.exists(notes_file):
              with open(notes_file, encoding="utf-8") as handle:
                  notes = handle.readline().strip()
          if not notes:
              notes = "উন্নতি ও ত্রুটি সংশোধন।"
          with open("windows-update.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {"version": version, "url": url, "sha256": sha, "notes": notes},
                  handle,
                  ensure_ascii=False,
              )
          PYEOF
          python gen_manifest.py "$VERSION" "$URL" "$SHA" windows-ime/update-notes.txt
          rm gen_manifest.py
          cat windows-update.json

      - name: Attach MSI + update manifest to GitHub release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MSI=$(ls windows-ime/build/compose/binaries/main/msi/*.msi)
          # Re-running this workflow for a tag that already has a release is
          # normal (a failed upload, a re-dispatch), and `gh release create`
          # fails outright on an existing tag. Upload into the existing
          # release instead, replacing the asset, so a re-run is idempotent.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MSI" windows-update.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --title "বাংলু টাইপার $TAG" --repo "$GITHUB_REPOSITORY" --notes "বাংলু টাইপার (Windows IME) — unsigned MSI installer." "$MSI" windows-update.json
          fi

      # The one URL the app is compiled to fetch, forever:
      #   .../releases/download/windows-update/windows-update.json
      #
      # It cannot use GitHub's `/releases/latest/download/` shortcut, because
      # this repository's "latest" release is a desktop-v* one — বাংলু এডিটর's
      # installers live here too — so `latest` would hand the Windows app a
      # manifest that has nothing to do with it. A dedicated, permanent release
      # holds the pointer instead. It is uploaded from the SAME bytes generated
      # in the step above, in the same run, so the pointer and the copy
      # attached to the real release cannot drift. Marked prerelease so this
      # bookkeeping release never becomes the repo's visible "Latest".
      - name: Publish the stable update pointer
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view windows-update --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload windows-update windows-update.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create windows-update --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "বাংলু টাইপার — আপডেট পয়েন্টার" \
              --notes "বাংলু টাইপার (Windows) এই ফাইলটি দেখে বোঝে নতুন সংস্করণ এসেছে কিনা। এটি মুছবেন না।" \
              windows-update.json
          fi
